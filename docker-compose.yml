# Local stack: Postgres + the app at http://localhost:8080
# Run from the repository root:  docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vikrikavach
      POSTGRES_USER: vikrikavach
      POSTGRES_PASSWORD: local-only-password
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikrikavach"]
      interval: 5s
      retries: 10
  app:
    build: { context: . }
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://vikrikavach:local-only-password@db:5432/vikrikavach
      JWT_SECRET: local-development-secret-at-least-32-chars
      APP_ENV: development
      OTP_MODE: dev
      ENABLE_SCHEDULER: "true"
      UPLOAD_DIR: /srv/var/uploads
      DEMO_APMC_CODE: "02190400"
      STAFF_PASSWORD: demo-officer-pass
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
volumes:
  pgdata:
