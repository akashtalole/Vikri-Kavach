[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vikrikavach"
version = "0.1.0"
description = "Vikri Kavach: protects farmers' APMC sales from weighing, rate, deduction and payment fraud"
requires-python = ">=3.11"
dependencies = [
  "bhavsetu",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.9",
  "boto3>=1.35",
  "python-multipart>=0.0.9",
  "anthropic>=2.8,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vikrikavach = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
