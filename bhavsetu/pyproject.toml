[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhavsetu"
version = "0.1.0"
description = "Market intelligence and fair-price tools for Maharashtra farmers and FPCs, on live MSAMB APMC prices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bhavsetu = "bhavsetu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bhavsetu = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
